<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은서의 다이어리</title>

    <link rel="stylesheet" href="./index-style.css">
    <script src="./index-script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">
    <header class="main-header">
        <h2>
            <a href="./index.html">은서의 다이어리</a>
            <img src="img/banner.jpg" alt="다이어리 배너">
        </h2>
    </header>

    <main>
        <section class="diary-section">
            <nav class="diary-banner" aria-label="보관함 메뉴">
                <p id="diary-album">일기보관함</p>
                <p id="photo-album">사진보관함</p>
            </nav>

            <div class="diary-header">
                <div class="filter-area">
                    <div class="emotion-dropdown">
                        <!-- 드롭다운 열기/닫기 -->
                        <input
                                type="checkbox"
                                id="emotion-dropdown-toggle"
                                class="emotion-dropdown-toggle"
                        >

                        <!-- 현재 선택값 -->
                        <label
                                for="emotion-dropdown-toggle"
                                id="emotion-dropdown-title"
                                class="emotion-dropdown-title"
                        >
                            <span id="selected-emotion-text">전체</span>
                            <img class="dropdown-arrow" src="./img/down_fill_light_m.svg" alt="">
                        </label>

                        <!-- 드롭다운 목록 -->
                        <ul class="emotion-dropdown-list">
                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-all"
                                        value="all"
                                        checked
                                >
                                <label for="emotion-all">
                                    <span>전체</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>

                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-happy"
                                        value="happy"
                                >
                                <label for="emotion-happy">
                                    <span>행복해요</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>

                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-sad"
                                        value="sad"
                                >
                                <label for="emotion-sad">
                                    <span>슬퍼요</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>

                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-surprised"
                                        value="surprised"
                                >
                                <label for="emotion-surprised">
                                    <span>놀랐어요</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>

                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-angry"
                                        value="angry"
                                >
                                <label for="emotion-angry">
                                    <span>화나요</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>

                            <li>
                                <input
                                        type="radio"
                                        name="emotion-filter"
                                        id="emotion-etc"
                                        value="etc"
                                >
                                <label for="emotion-etc">
                                    <span>기타</span>
                                    <img class="check-icon" src="./img/check_outline_light_xs.svg" alt="">
                                </label>
                            </li>
                        </ul>
                    </div>

                    <div class="filter-search-area">
                        <span aria-hidden="true">🔎</span>

                        <input
                                type="search"
                                id="search-input"
                                placeholder="검색어를 입력해주세요."
                                aria-label="일기 검색"
                        >
                    </div>

                    <div class="diary-navigator">
                        <button
                                type="button"
                                id="open-diary-modal-button"
                                class="tab"
                        >
                            + 일기쓰기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 다이어리 목록 -->
            <div id="diary-list-area" class="diary-list"></div>
            <!-- 페이지네이션 -->
            <div id="pagination" class="pagination">
                <button id="pagination-prev-button" class="pagination-arrow pagination-prev" type="button">
                    <img id="pagination-prev-image" src="./img/rightdisabled_outline_light_m.svg" alt="">
                </button>

                <span id="pagination-number-area" class="pagination-number-area"></span>

                <button id="pagination-next-button" class="pagination-arrow pagination-next" type="button">
                    <img id="pagination-next-image" src="./img/rightdisabled_outline_light_m.svg" alt="">
                </button>
            </div>
        </section>

        <!-- 상단 이동 버튼 -->
        <button
                type="button"
                id="scroll-top-button"
                class="scroll-top-button"
                aria-label="맨 위로 이동"
        >
            <img
                    src="./img/up_outline_light_xl.svg"
                    width="40"
                    height="40"
                    alt=""
            >
        </button>
    </main>
</div>

<!-- 일기 작성 모달 -->
<div
        id="diary-modal"
        class="form-grid"
        role="dialog"
        aria-modal="true"
        aria-labelledby="diary-modal-title"
        aria-hidden="true"
>
    <div class="form-panel">
        <form id="diary-form">
            <div class="form-fields">
                <div class="field">
                    <div class="modal-title">
                        <h3 id="diary-modal-title">일기 쓰기</h3>
                            <div class="dark-mode-area">
                                다크모드
                                <input type="checkbox" class="dark-toggle"/>
                            </div>
                    </div>
                    <label>오늘 기분은 어땠나요?</label>

                    <div class="mood-group">
                        <label class="mood-option">
                            <input
                                    type="radio"
                                    name="mood"
                                    value="행복"
                                    checked
                            >
                            행복해요
                        </label>

                        <label class="mood-option">
                            <input
                                    type="radio"
                                    name="mood"
                                    value="슬픔"
                            >
                            슬퍼요
                        </label>

                        <label class="mood-option">
                            <input
                                    type="radio"
                                    name="mood"
                                    value="놀램"
                            >
                            놀랐어요
                        </label>

                        <label class="mood-option">
                            <input
                                    type="radio"
                                    name="mood"
                                    value="화남"
                            >
                            화가나요
                        </label>

                        <label class="mood-option">
                            <input
                                    type="radio"
                                    name="mood"
                                    value="기타"
                            >
                            기타
                        </label>
                    </div>
                </div>

                <div class="field">
                    <label for="title-input">제목</label>

                    <input
                            id="title-input"
                            type="text"
                            placeholder="제목을 입력해 주세요."
                            required
                    >
                </div>

                <div class="field">
                    <label for="content-input">내용</label>

                    <textarea
                            id="content-input"
                            placeholder="내용을 입력해 주세요."
                            required
                    ></textarea>
                </div>
                <div class="btn">
                    <button
                            class="close-btn"
                            onclick="closeDiaryModal()"
                            type="button"
                    >
                        닫기
                    </button>
                        <button
                                class="form-btn"
                                id="submit-diary-button"
                                type="submit"
                        >
                            일기 등록하기
                        </button>
                </div>


            </div>
        </form>
    </div>

    <!-- 등록 완료 모달 -->
    <div id="success-diary-modal" class="success-modal">
        <div class="nesting-modal">
            <div class="nesting-modal-title">
                일기 등록 완료
            </div>
            <p>등록이 완료되었습니다.</p>
            <button id="close-submit-diary-button" type="button">
                확인
            </button>
        </div>
    </div>
</div>
</body>
</html>
