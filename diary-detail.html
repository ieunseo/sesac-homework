<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<title>상세보기</title>
    <link rel="stylesheet" href="./detail-style.css">
    <script src="./detail-script.js" defer></script>
</head>
<body><div class="container">
        <header class="main-header">
            <h2>
                <a href="./index.html">은서의 다이어리</a>
            </h2>
        </header>
        <div class="diary-dtail-area">
            <!-- 타이틀 -->
            <div class="diary-detail-title">
                <div class="diary-title">제목</div>
            </div>
            <hr>
            <!-- 감정상태 -->
            <div class="emotion-state">
                <div class="mood-img"><img src="./img/happy.png"/></div>
                <div class="mood-class">행복해요</div>
                <div class="diary-date">작성일 YYYY.MM.DD</div>
            </div>
            <div class="diary-content">내용
            </div>
            <!-- 오른쪽 하단에 내용복사 -->
            <div class="action-area">
                <div class="content-copy">
                    <img class="content-copy-img" src="./img/copy_outline_light_m.svg"/>
                    내용복사
                </div>
                <div class="diary-detail-btn-area">
                    <button class="diary-detail-btn" >수정</button>
                    <button class="diary-detail-btn" id="diary-delete-btn">삭제</button>
                </div>
            </div>

            <hr>
            <p class="comment-title-area">회고</p>
            <section class="comment-area">
                <form id="comment-form" class="comment-area">
                    <input
                        id="comment-input"
                        type="text"
                        placeholder="회고를 남겨보세요."
                        required
                    >
                    <button
                        class="comment-btn"
                        id="comment-button"
                        type="submit"
                    >
                        입력
                    </button>
                </form>

            </section>
            <div class="comment-list"> 등록된 회고가 없습니다. </div>
        </div>
    </div>
<!-- 토스트-->
<div class="copy-toast">
    복사되었어요
</div>
<!-- 모달 -->
<div id="delete-modal" class="delete-modal">
    <div class="delete-modal-content">

        <div class="delete-modal-text-area">
            <h3>일기 삭제</h3>
            <p>일기를 삭제하시겠어요?</p>
        </div>

        <div class="delete-modal-button-area">
            <button
                    type="button"
                    id="cancel-delete-button"
            >
                취소
            </button>

            <button
                    type="button"
                    id="confirm-delete-button"
            >
                삭제
            </button>
        </div>

    </div>
</div>
</body>
</html>
